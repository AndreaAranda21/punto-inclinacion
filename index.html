<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto con inclinación</title>
    <script defer src="index.js"></script>

    <style>
        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            background-color: #e7edf0;
        }

        #punto {
            width: 30px;
            height: 30px;
            background-color: royalblue;
            border-radius: 50%;
            position: absolute;
            left: 50%;
            top: 50%;
        }
    </style>
</head>
<body>
    <div id="punto"></div>
</body>
</html>
